<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARSCRIPTST</title>
    <style>
        /* Body Background */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, rgba(135, 206, 250, 0.9), rgba(173, 216, 230, 0.8), rgba(70, 130, 180, 0.7));
            animation: backgroundGlow 6s infinite alternate;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Background Glow Animation */
        @keyframes backgroundGlow {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 100% 100%;
            }
        }

        /* Centered Text Title */
        .center-text {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        /* Container for Text Boxes Vertically */
        .redirect-container {
            display: flex;
            flex-direction: column;  /* Arrange the boxes vertically */
            align-items: center;     /* Center the text boxes horizontally */
            gap: 40px;               /* Increased gap to make the boxes farther apart */
            margin-top: 20px;
        }

        /* Text Above Each Box */
        .text-label {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px; /* Space between label and box */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); /* Subtle glow effect for label */
        }

        /* Individual Text Box Styles */
        .redirect-box {
            display: inline-block;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1); /* Transparent background */
            border: 2px solid rgba(255, 255, 255, 0.3); /* Subtle border */
            border-radius: 10px; /* Rounded corners */
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); /* Glow effect */
            transition: all 0.3s ease;
            cursor: pointer;  /* Changes cursor to pointer to indicate it's clickable */
        }

        /* Hover Effect for Text Boxes (Move Below Each Other) */
        .redirect-box:hover {
            background: rgba(255, 255, 255, 0.3); /* Slightly brighter background */
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); /* Enhanced glow */
            transform: translateY(10px) scale(1.05); /* Move the box downwards and scale up slightly */
        }

        /* Discord Link Styles */
        .discord-link {
            position: absolute;
            top: 20px;
            right: 20px;
            display: inline-block;
        }

        /* Discord Logo Image */
        .discord-link img {
            width: 40px;  /* Adjust size as needed */
            height: 40px; /* Adjust size as needed */
            background: transparent; /* Ensure no background color */
            border-radius: 50%; /* Optional: Makes the logo circular */
            border: none;  /* Remove any borders */
            box-shadow: none; /* Remove any shadow */
            opacity: 1; /* Ensure full opacity */
            transition: opacity 0.3s, transform 0.3s;
        }

        /* Optional: Hover Effect for the Discord logo */
        .discord-link img:hover {
            opacity: 0.8; /* Optional: Slightly fade when hovered */
            transform: scale(1.1); /* Optional: Slight zoom effect */
        }
    </style>
</head>
<body>
    <!-- Background with transparent text -->
    <div class="container">
        <h1 class="center-text">ARSCRIPTS</h1>

        <!-- Redirect text boxes container -->
        <div class="redirect-container">
            <!-- Text Above Each Box -->
            <div class="text-label">Generate Scripts By Joining my Discord Server Below</div>
            
            <!-- Redirect box with href (Clickable to Discord Link) -->
            <a href="https://discord.gg/xSnUz2tXY2" target="_blank" class="redirect-box">Click Here To Join My Discord Server</a>
            </a>
        </div>

        <!-- Discord server link in the top-right corner -->
        <a href="https://discord.gg/xSnUz2tXY2" target="_blank" class="discord-link">
            <img src="https://cdn.discordapp.com/attachments/999509391948656721/1308246440660959342/download_1.png?ex=673d3ef1&is=673bed71&hm=14f38bb5ec2a5bc0532281aecc66e49a0e3b807a85af6ff1cfd83024463ac22d&" alt="Discord Server">
        </a>
    </div>
</body>
</html>
